name: zen-backend

# Common configurations shared across services
x-laravel-common: &laravel-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  working_dir: /var/www
  env_file:
    - .env
  networks:
    - zen-network
  logging: &logging-config
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# Common environment overrides for container communication
x-laravel-env: &laravel-env
  DB_HOST: db
  REDIS_HOST: redis

services:
  # PHP-FPM Application Service
  app:
    <<: *laravel-common
    container_name: zen-app
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - ./storage:/var/www/storage
      - public_assets:/var/www/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Caddy Web Server (Handles automatic HTTPS, Let's Encrypt, and proxies PHP-FPM)
  web:
    image: caddy:2-alpine
    container_name: zen-web
    restart: unless-stopped
    ports:
      - "${FORWARD_HTTP_PORT:-80}:80"
      - "${FORWARD_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - public_assets:/var/www/public:ro
    depends_on:
      - app
    networks:
      - zen-network
    logging:
      <<: *logging-config

  # PostgreSQL Database Service (With healthcheck)
  db:
    image: postgres:16-alpine
    container_name: zen-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zen_backend}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-root} -d $${POSTGRES_DB:-zen_backend}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zen-network
    logging:
      <<: *logging-config

  # Redis Cache & Queue Broker (With healthcheck)
  redis:
    image: redis:7-alpine
    container_name: zen-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zen-network
    logging:
      <<: *logging-config

  # Laravel Queue Worker Service
  queue-worker:
    <<: *laravel-common
    container_name: zen-queue-worker
    user: www-data
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Cron Scheduler Service
  scheduler:
    <<: *laravel-common
    container_name: zen-scheduler
    command: crond -f -l 2
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  zen-network:
    name: zen-backend_zen-network
    driver: bridge

volumes:
  pgdata:
    name: zen-backend_pgdata
    driver: local
  redisdata:
    name: zen-backend_redisdata
    driver: local
  caddy_data:
    name: zen-backend_caddy_data
    driver: local
  caddy_config:
    name: zen-backend_caddy_config
    driver: local
  public_assets:
    name: zen-backend_public_assets
    driver: local
